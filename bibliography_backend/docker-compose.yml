# Development Docker Compose for Bibliography Backend
# Adapted from editor_backend/docker-compose.yml pattern

version: '3.8'

services:
  bibliography-backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: bibliography-backend
    ports:
      - "8005:8005"  # Expose to host for API testing
    environment:
      - NODE_ENV=development
      - PORT=8005
      - MONGODB_URL=mongodb://mongodb:27017/bibliography_dev
      - LOG_LEVEL=debug
    volumes:
      - ./src:/app/src           # Live code reload via bind mount
      - ./logs:/app/logs         # Persistent logs on host
      - /app/node_modules        # Prevent host node_modules override
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - bibliography-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  mongodb:
    image: mongo:7
    container_name: bibliography-mongodb
    ports:
      - "27017:27017"  # Expose for MongoDB Compass/CLI access
    volumes:
      - mongodb_data:/data/db  # Persist database data
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - bibliography-network
    restart: unless-stopped

  # Optional: Uncomment if you need Redis for caching/sessions
  # redis:
  #   image: redis:7-alpine
  #   container_name: bibliography-redis
  #   ports:
  #     - "6379:6379"
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 3s
  #     retries: 5
  #   networks:
  #     - bibliography-network
  #   restart: unless-stopped

networks:
  bibliography-network:
    driver: bridge

volumes:
  mongodb_data:
