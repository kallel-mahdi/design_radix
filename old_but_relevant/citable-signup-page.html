<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up - Citable</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ============================================
           LIGHT MODE - Matching Bento Palette
           ============================================ */
        :root {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-input: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border-default: #e2e8f0;
            --border-input: #cbd5e1;

            /* Accent - sky blue for auth */
            --accent-primary: #0284c7;
            --accent-hover: #0369a1;

            --warm-shadow: rgba(15, 23, 42, 0.08);
            --radius-md: 10px;
        }

        /* ============================================
           DARK MODE - Aurora Palette
           ============================================ */
        [data-theme="dark"] {
            --bg-primary: #121218;
            --bg-secondary: #1a1a22;
            --bg-input: #23232d;
            --text-primary: #e8e8f0;
            --text-secondary: #a8a8b8;
            --text-muted: #6e6e7e;
            --border-default: #2e2e3a;
            --border-input: #3a3a48;

            /* Brighter accent for dark mode */
            --accent-primary: #38bdf8;
            --accent-hover: #7dd3fc;

            --warm-shadow: rgba(0, 0, 0, 0.3);
        }

        /* Auto dark mode */
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg-primary: #121218;
                --bg-secondary: #1a1a22;
                --bg-input: #23232d;
                --text-primary: #e8e8f0;
                --text-secondary: #a8a8b8;
                --text-muted: #6e6e7e;
                --border-default: #2e2e3a;
                --border-input: #3a3a48;
                --accent-primary: #38bdf8;
                --accent-hover: #7dd3fc;
                --warm-shadow: rgba(0, 0, 0, 0.3);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            position: relative;
            -webkit-font-smoothing: antialiased;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* Noise texture */
        body::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0.03;
            pointer-events: none;
            z-index: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        /* ============================================
           AUTH LAYOUT
           ============================================ */
        .auth-wrapper {
            padding: 2.5rem 0;
            max-width: 1280px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        .header-bar {
            padding: 0 4rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .logo-icon {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #4f46e5 0%, #0284c7 50%, #059669 100%);
            border-radius: 8px;
        }

        .logo-text {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
        }

        /* Theme Toggle */
        .theme-toggle {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            position: relative;
        }

        .theme-toggle:hover {
            background: var(--bg-secondary);
            color: var(--accent-primary);
        }

        .theme-toggle .icon-sun,
        .theme-toggle .icon-moon {
            position: absolute;
            transition: opacity 0.2s ease, transform 0.3s ease;
        }

        .theme-toggle .icon-sun {
            opacity: 1;
            transform: rotate(0deg);
        }

        .theme-toggle .icon-moon {
            opacity: 0;
            transform: rotate(-90deg);
        }

        [data-theme="dark"] .theme-toggle .icon-sun {
            opacity: 0;
            transform: rotate(90deg);
        }

        [data-theme="dark"] .theme-toggle .icon-moon {
            opacity: 1;
            transform: rotate(0deg);
        }

        .auth-content {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }

        /* ============================================
           REGISTER COMPONENT
           ============================================ */
        .register-container {
            width: 30%;
            min-width: 320px;
        }

        .register-container > * + * {
            margin-top: 2rem;
        }

        .register-title {
            font-weight: 700;
            font-size: 3rem;
            color: var(--text-primary);
            margin-bottom: 1.75rem;
            width: 100%;
            letter-spacing: -0.025em;
        }

        .register-form {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .name-row {
            display: flex;
            gap: 0.75rem;
        }

        .name-row > div {
            flex: 1;
        }

        /* ============================================
           INPUT - Neutral borders, accent on focus
           ============================================ */
        .input {
            width: 100%;
            padding: 0.625rem 1rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-input);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 0.875rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .input::placeholder {
            color: var(--text-muted);
        }

        .input:hover {
            border-color: var(--text-muted);
        }

        .input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        [data-theme="dark"] .input:focus {
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        .input.error {
            border-color: #ef4444;
        }

        .error-text {
            color: #ef4444;
            font-size: 0.875rem;
            min-height: 1.25rem;
        }

        /* ============================================
           BUTTON
           ============================================ */
        .btn {
            width: 100%;
            padding: 0.625rem 1rem;
            border-radius: var(--radius-md);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            border: none;
            font-size: 0.875rem;
            font-weight: 500;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: var(--accent-primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .spinner {
            width: 1rem;
            height: 1rem;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ============================================
           FOOTER LINKS
           ============================================ */
        .auth-link {
            color: var(--text-secondary);
            font-size: 0.9375rem;
            text-align: center;
        }

        .auth-link a {
            font-weight: 600;
            color: var(--text-primary);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .auth-link a:hover {
            color: var(--accent-primary);
        }

        .auth-link a.accent {
            color: var(--accent-primary);
        }

        .auth-link a.accent:hover {
            color: var(--accent-hover);
        }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 768px) {
            .register-container {
                width: 90%;
            }

            .name-row {
                flex-direction: column;
                gap: 0.5rem;
            }

            .header-bar {
                padding: 0 1.5rem;
            }

            .register-title {
                font-size: 2.25rem;
            }
        }
    </style>
</head>
<body>
    <div class="auth-wrapper">
        <!-- Header -->
        <div class="header-bar">
            <a href="#" class="logo">
                <div class="logo-icon"></div>
                <span class="logo-text">Citable</span>
            </a>
            <button class="theme-toggle" title="Toggle theme" onclick="toggleTheme()">
                <svg class="icon-sun" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
                </svg>
                <svg class="icon-moon" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
                </svg>
            </button>
        </div>

        <!-- Auth Content -->
        <div class="auth-content">
            <div class="register-container">
                <!-- Title -->
                <div class="register-title">Get started</div>

                <!-- Form -->
                <form class="register-form" id="signup-form">
                    <!-- Invite Code -->
                    <input type="text" class="input" id="inviteCode" placeholder="Invite Code" autocomplete="off">
                    <p class="error-text" id="inviteCode-error"></p>

                    <!-- Name Row -->
                    <div class="name-row">
                        <div>
                            <input type="text" class="input" id="firstName" placeholder="First Name" autocomplete="given-name">
                            <p class="error-text" id="firstName-error"></p>
                        </div>
                        <div>
                            <input type="text" class="input" id="lastName" placeholder="Last Name" autocomplete="family-name">
                            <p class="error-text" id="lastName-error"></p>
                        </div>
                    </div>

                    <!-- Email -->
                    <input type="email" class="input" id="email" placeholder="Email" autocomplete="email">
                    <p class="error-text" id="email-error"></p>

                    <!-- Password -->
                    <input type="password" class="input" id="password" placeholder="Password" autocomplete="new-password">
                    <p class="error-text" id="password-error"></p>

                    <!-- Submit -->
                    <button type="submit" class="btn btn-primary" id="submit-btn">Sign up</button>
                </form>

                <!-- Footer Links -->
                <div class="auth-link">
                    Already have an account? <a href="#">Sign in</a>
                </div>
                <div class="auth-link">
                    Don't have an invite code? <a href="#" class="accent">Request access</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Theme toggle
        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
        }

        // Initialize theme
        function initTheme() {
            const saved = localStorage.getItem('theme');
            if (saved) {
                document.documentElement.setAttribute('data-theme', saved);
            } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        }
        initTheme();

        // Form demo
        document.getElementById('signup-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.innerHTML = '<span class="spinner"></span> Sign up';
            btn.disabled = true;

            setTimeout(() => {
                btn.innerHTML = 'Sign up';
                btn.disabled = false;
            }, 2000);
        });
    </script>
</body>
</html>
