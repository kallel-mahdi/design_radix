<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Details Pane - Aurora</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #080a10;
      padding: 24px;
      min-height: 100vh;
    }

    .details-pane {
      width: 360px;
      background: #0e1218;
      border-left: 1px solid #242e3c;
      height: 600px;
      display: flex;
      flex-direction: column;
    }

    /* Tabs */
    .tabs {
      display: flex;
      border-bottom: 1px solid #242e3c;
      background: #0e1218;
    }

    .tab {
      flex: 1;
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 500;
      color: #6d7a8c;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.15s ease;
      text-align: center;
    }

    .tab:hover {
      color: #a4b4c8;
      background: #1a222c;
    }

    .tab.active {
      color: #0ea5e9;
      border-bottom-color: #0ea5e9;
    }

    /* Content Area */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    /* Info Tab Content */
    .info-section {
      margin-bottom: 20px;
    }

    .info-section h3 {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #6d7a8c;
      margin-bottom: 8px;
    }

    .field-row {
      display: flex;
      flex-direction: column;
      margin-bottom: 12px;
    }

    .field-label {
      font-size: 12px;
      color: #6d7a8c;
      margin-bottom: 4px;
    }

    .field-value {
      font-size: 14px;
      color: #e6ecf6;
      line-height: 1.4;
    }

    .field-value a {
      color: #0ea5e9;
      text-decoration: none;
    }

    .field-value a:hover {
      text-decoration: underline;
    }

    /* Tags */
    .tags-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      font-size: 12px;
      border-radius: 4px;
      font-weight: 500;
    }

    .tag-emerald {
      background: rgba(34, 197, 94, 0.15);
      color: #22c55e;
    }

    .tag-violet {
      background: rgba(168, 85, 247, 0.15);
      color: #a855f7;
    }

    .tag-cyan {
      background: rgba(14, 165, 233, 0.15);
      color: #0ea5e9;
    }

    /* Authors list */
    .authors-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .author {
      font-size: 14px;
      color: #e6ecf6;
    }

    /* Divider */
    .divider {
      height: 1px;
      background: #1a222c;
      margin: 16px 0;
    }

    /* PDF Tab Content */
    .pdf-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 400px;
      background: #161c24;
      border-radius: 8px;
      border: 1px dashed #242e3c;
    }

    .pdf-icon {
      width: 48px;
      height: 48px;
      margin-bottom: 12px;
      color: #6d7a8c;
    }

    .pdf-text {
      font-size: 14px;
      color: #6d7a8c;
      margin-bottom: 12px;
    }

    .upload-btn {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 500;
      color: #e6ecf6;
      background: #0ea5e9;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    /* Notes Tab Content */
    .notes-area {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .notes-textarea {
      flex: 1;
      width: 100%;
      padding: 12px;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.6;
      color: #e6ecf6;
      background: #161c24;
      border: 1px solid #242e3c;
      border-radius: 8px;
      resize: none;
    }

    .notes-textarea::placeholder {
      color: #6d7a8c;
    }

    .notes-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 12px;
    }

    .save-btn {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 500;
      color: #e6ecf6;
      background: #0ea5e9;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    /* Multiple panes for showcase */
    .showcase {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
    }

    .showcase-label {
      position: absolute;
      top: -24px;
      left: 0;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #a855f7;
    }

    .pane-wrapper {
      position: relative;
    }
  </style>
</head>
<body>
  <div class="showcase">
    <!-- Info Tab (Active) -->
    <div class="pane-wrapper">
      <span class="showcase-label">Info Tab</span>
      <div class="details-pane">
        <div class="tabs">
          <div class="tab active">Info</div>
          <div class="tab">PDF</div>
          <div class="tab">Notes</div>
        </div>
        <div class="content">
          <div class="info-section">
            <h3>Title</h3>
            <div class="field-value">Attention Is All You Need</div>
          </div>

          <div class="info-section">
            <h3>Authors</h3>
            <div class="authors-list">
              <span class="author">Ashish Vaswani</span>
              <span class="author">Noam Shazeer</span>
              <span class="author">Niki Parmar</span>
              <span class="author">+5 more</span>
            </div>
          </div>

          <div class="divider"></div>

          <div class="info-section">
            <div class="field-row">
              <span class="field-label">Year</span>
              <span class="field-value">2017</span>
            </div>
            <div class="field-row">
              <span class="field-label">Venue</span>
              <span class="field-value">NeurIPS</span>
            </div>
            <div class="field-row">
              <span class="field-label">DOI</span>
              <span class="field-value"><a href="#">10.48550/arXiv.1706.03762</a></span>
            </div>
          </div>

          <div class="divider"></div>

          <div class="info-section">
            <h3>Tags</h3>
            <div class="tags-row">
              <span class="tag tag-emerald">Machine Learning</span>
              <span class="tag tag-violet">Transformers</span>
              <span class="tag tag-cyan">NLP</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- PDF Tab -->
    <div class="pane-wrapper">
      <span class="showcase-label">PDF Tab (Empty)</span>
      <div class="details-pane">
        <div class="tabs">
          <div class="tab">Info</div>
          <div class="tab active">PDF</div>
          <div class="tab">Notes</div>
        </div>
        <div class="content">
          <div class="pdf-placeholder">
            <svg class="pdf-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
            <span class="pdf-text">No PDF attached</span>
            <button class="upload-btn">Upload PDF</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Notes Tab -->
    <div class="pane-wrapper">
      <span class="showcase-label">Notes Tab</span>
      <div class="details-pane">
        <div class="tabs">
          <div class="tab">Info</div>
          <div class="tab">PDF</div>
          <div class="tab active">Notes</div>
        </div>
        <div class="content">
          <div class="notes-area">
            <textarea class="notes-textarea" placeholder="Add your notes here...">The transformer architecture introduced in this paper revolutionized NLP and later computer vision.

Key innovations:
- Self-attention mechanism
- Positional encoding
- Multi-head attention

This paper should be cited in Chapter 3 of my thesis.</textarea>
            <div class="notes-footer">
              <button class="save-btn">Save Notes</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
